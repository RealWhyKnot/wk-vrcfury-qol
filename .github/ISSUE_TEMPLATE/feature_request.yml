name: Feature request
description: Suggest an idea for this project.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [Tools Overview](https://github.com/RealWhyKnot/wk-vrcfury-qol/blob/main/wiki/Tools-Overview.md) first to see whether the behaviour you want already exists.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the avatar workflow you're stuck on.
      placeholder: e.g. "When refactoring my avatar I need to ... and there's no fast way to do it without ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you want to happen. If you can sketch the UI ("right-click ___ to get ___"), do.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you've tried.

  - type: textarea
    id: extra-context
    attributes:
      label: Additional context
      description: Screenshots, links to similar features in other tools, anything that helps.
