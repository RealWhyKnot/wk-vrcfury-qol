name: Version guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  no-hardcoded-versions:
    uses: RealWhyKnot/workflows/.github/workflows/version-guard.yml@v1
    with:
      error-hint: 'Use PackageInfo.FindForAssembly() instead -- see Editor/*Logger.cs for the pattern.'
